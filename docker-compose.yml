# ocirrf — нэг командаар байршуулах (V4-15): docker compose up -d
# Тохиргоо: cp .env.example .env → JWT нууцуудаа солино.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ocirrf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocirrf123}
      POSTGRES_DB: ${POSTGRES_DB:-ocirrf}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocirrf_user} -d ${POSTGRES_DB:-ocirrf}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-ocirrf_user}:${POSTGRES_PASSWORD:-ocirrf123}@db:5432/${POSTGRES_DB:-ocirrf}?schema=public}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET-ээ .env-д тохируулна уу}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET-ээ .env-д тохируулна уу}
      PORT: 3000
    volumes:
      - uploads:/app/backend/uploads
      - logs:/app/backend/logs
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  dbdata:
  uploads:
  logs:
